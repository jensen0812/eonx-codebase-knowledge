version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eonx-postgres
    environment:
      POSTGRES_USER: eonx
      POSTGRES_PASSWORD: eonx_secret
      POSTGRES_DB: codebase_knowledge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata:
